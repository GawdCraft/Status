<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Minecraft Server Status</title>

	<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
	<style type="text/css">
		.jumbotron {
			margin-top: 30px;
			border-radius: 0;
		}

		.table thead th {
			background-color: #428BCA;
			border-color: #428BCA !important;
			color: #FFF;
		}
	</style>
</head>

<body>
    <div class="container">
    	<div class="jumbotron">
			<h1>Minecraft Server Status</h1>

			<p>{{ server.name }} - {{ server.ip }}:{{ server.port }}</p>

		</div>


		<div class="panel panel-primary">
			<div class="panel-heading">{{ exception.message }}</div>
			<div class="panel-body">{{ exception.trace }}</div>
		</div>


		<div class="row">
			<div class="col-sm-6">
				<table class="table table-bordered table-striped">
					<thead>
						<tr>
							<th colspan="2">Server Info <em>({{ status }})</em></th>
						</tr>
					</thead>
					<tbody>

						<tr>
							<td>{{ info.key }}</td>
							<td>{{ info.value }}</td>
						</tr>


						<tr id="info-none">
							<td colspan="2">No Information</td>
						</tr>

					</tbody>
				</table>
			</div>

			<div class="col-sm-6">
				<table class="table table-bordered table-striped">
					<thead>
						<tr>
							<th>Players <em>({{ players.size }})</em></th>
						</tr>
					</thead>
					<tbody>

						<tr>
							<td>
								<img src="{{ avatarURL }}/{{ player.id }}" alt="{{ player.name }}">
								<span>{{ player.name }}</span>
							</td>
						</tr>

						<tr id="players-none">
							<td>No Players Online</td>
						</tr>

					</tbody>
				</table>
			</div>
		</div>

	</div>
<script type="text/javascript">
	var config = {
		"name": "Sample",
		"host": "localhost",
		"port": 25565,
		"protocol": "java",
		"timeout": 5
	};
	var avatarURL = "";
</script>
<script type="text/javascript" src="mc-query.js"></script>
</body>
</html>
